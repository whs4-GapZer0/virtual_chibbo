# Trivy loads this file by default (--secret-config trivy-secret.yaml) when the
# verify workflow scans the checkout.  Built-in rules catch cloud and token
# formats; this rule adds the internal format Chibbo forbids: a server account
# password written in plain text in a configuration file (ISMS-P 2.7.1, the
# 2025 SK Telecom root cause).  CRITICAL, so APP-E-01 fails while one exists.
rules:
  - id: plaintext-server-account-password
    category: general
    title: Plaintext server account password in a configuration file
    severity: CRITICAL
    path: .*\.(conf|ini|cfg)$
    keywords:
      - password
      - passwd
    regex: (?im)^[ \t]*(?:password|passwd)[ \t]*=[ \t]*(?P<secret>[^\s#;]{12,})[ \t]*$
    secret-group-name: secret
