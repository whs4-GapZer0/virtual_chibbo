name: Risk acceptance
description: Record a time-bounded exception approved by the accountable owner.
title: "[Risk acceptance] "
labels: [risk-acceptance]
body:
  - type: markdown
    attributes:
      value: |
        위험 수용은 통제를 없애는 결정이 아닙니다. 보완 통제·만료일·재검토일이 없는 요청은 승인할 수 없습니다.
        승인자(`governance/approvers.json`의 `risk_acceptance`, 작성자 제외)가 `risk-accepted` 라벨을 붙인 시각이 승인 시각입니다.
        종결할 때는 사유를 댓글로 남기고 이슈를 닫습니다.
  - type: dropdown
    id: asset
    attributes:
      label: 대상 자산
      options:
        - A-01 AWS 계정 관리 평면 (IAM·KMS·CloudTrail·Config·CloudFormation)
        - A-02 VPC chibbo 네트워크
        - A-03 ALB 공개 HTTPS 진입점
        - A-04 채용지원 플랫폼 애플리케이션 (ECS Fargate·ECR 이미지)
        - A-05 RDS PostgreSQL
        - A-06 S3 이력서 버킷
        - A-07 S3 감사·구성 이력 버킷
        - A-08 GitHub 저장소 virtual_chibbo
        - A-14 Prowler 스캐너 EC2
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 수용하려는 위험과 근거
      description: 관련 통제·취약점 ID(예 Prowler check, CVE), 발생 가능성, 영향을 적습니다.
    validations:
      required: true
  - type: textarea
    id: compensating_control
    attributes:
      label: 보완 통제
      description: 만료일까지 적용하는 완화 조치를 적습니다.
    validations:
      required: true
  - type: input
    id: expires_at
    attributes:
      label: 만료일
      description: "YYYY-MM-DD (KST)"
    validations:
      required: true
  - type: input
    id: review_at
    attributes:
      label: 재검토일
      description: "YYYY-MM-DD (KST), 만료일 이전"
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 조치 책임자
    validations:
      required: true
