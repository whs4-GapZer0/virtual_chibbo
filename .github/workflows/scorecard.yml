name: scorecard

# OpenSSF Scorecard for this public repository. Publishing the result lets
# api.securityscorecards.dev serve it, which GapZer0's OpenSSF Scorecard
# connector (SUP-C-02 · SUP-C-06 · SUP-E-04) reads.
on:
  branch_protection_rule:
  schedule:
    - cron: "17 18 * * 1" # Tuesdays 03:17 KST
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      # Upload the SARIF result to code scanning.
      security-events: write
      # Publish the result to the public Scorecard API.
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@51f77329afa6477de8c49fc9c7046c15b9a4e79d # v3.29.5
        with:
          sarif_file: results.sarif
