name: tvm-export
# Daily export of Chibbo's real change, intake and analysis records for
# GapZer0 GRC TVM-C-06/E-03/E-04 (scripts/chibbo_evidence/tvm_export.py).
# GRC reads the newest workbook under exports/tvm/chibbo/ with its own role;
# a day without a successful run shows in GRC as stale coverage.  The
# workbook names AWS principals, so it is never kept as a (public) run artifact.
on:
  schedule:
    - cron: "40 15 * * *" # 00:40 Asia/Seoul, after the KST day the coverage must include
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  id-token: write

concurrency:
  group: chibbo-tvm-export
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    # The exporter role trusts only this environment's OIDC subject; restrict
    # the environment to main so another branch cannot forge an export.
    environment: chibbo-dev-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      AWS_REGION: ap-northeast-2
      # CloudTrail LookupEvents allows about 2 calls a second per region.
      AWS_RETRY_MODE: adaptive
      AWS_MAX_ATTEMPTS: "10"
      # GapZer0 GRC instance ID of the recruitment platform system.
      GRC_PLATFORM_INSTANCE_ID: "038485873836"
      EVIDENCE_BUCKET: gapzero-evidence-992764023398-ap-northeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Assume the Bootstrap-provisioned TVM exporter role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::992764023398:role/chibbo-dev-tvm-exporter
          role-session-name: tvm-export-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}
      - name: Export TVM records to the GapZer0 evidence bucket
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: |
          python -m chibbo_evidence.tvm_export \
            --instance-id "$GRC_PLATFORM_INSTANCE_ID" \
            --out "$RUNNER_TEMP/chibbo-tvm.xlsx" \
            --upload-bucket "$EVIDENCE_BUCKET"
